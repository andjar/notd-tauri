[package]
name = "outliner"
version = "0.1.0"
description = "A simple, durable block-based outliner application"
authors = ["Outliner Team"]
license = "MIT"
repository = "https://github.com/outliner/outliner"
default-run = "outliner"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-beta.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0-beta.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.0-beta.0"
tauri-plugin-dialog = "2.0.0-beta.0"
tauri-plugin-fs = "2.0.0-beta.0"

tokio = { version = "1.0", features = ["full"] }

# Database dependencies
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Markdown parsing
pulldown-cmark = "0.9"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Regular expressions
regex = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP server for local API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.0"

[features]
# By default, build without a custom distDir
default = ["custom-protocol"]
# Custom protocol for serving assets
custom-protocol = ["tauri/custom-protocol"]
